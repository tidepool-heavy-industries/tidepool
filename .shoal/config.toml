[defaults]
model = "gpt-5.6-sol"
effort = "low"

[haskell]
source_roots = ["."]
modules = ["Project.Types", "Project.Work", "Project.Plan", "Project.Observe"]
checks = ["Project.Checks.workbench", "Project.CollaborationChecks.collaboration", "Project.RoutingChecks.routing"]

# No `[prompts] root` or `core`. Those keys displace the shipped `root.md` and
# `base.md` wholesale, and the local copies drifted until they instructed the
# opposite of what the shipped ones say — "become idle after accepted planning
# handoff" against "planning handoff does not require becoming idle". The
# shipped prompts are the maintained shared authority; anything this repository
# genuinely needs on top of them belongs in `plans/`, which they can be pointed
# at, not in a private fork of them.

# Only entries this workspace's own Haskell reads. `Project.Work` reads task,
# review, repair, incorporate and specialist; `Project.Plan` reads lead;
# `Project.Observe` reads rsi. A `coordinator` entry was dropped because nothing
# read it, and a `planner` entry with it — its file reached the root through the
# `[prompts] root` key above rather than through this table.
[prompts.files]
lead = "prompts/lead.md"
specialist = "prompts/specialist.md"
task = "prompts/task.md"
review = "prompts/review.md"
repair = "prompts/repair.md"
incorporate = "prompts/incorporate.md"
rsi = "prompts/rsi.md"
