[package]
name = "tidepool-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Bridge between Rust types and Tidepool Core values"
readme = "../README.md"

[dependencies]
thiserror.workspace = true
tidepool-repr.workspace = true
tidepool-eval.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
inventory.workspace = true

[dev-dependencies]
proptest.workspace = true
tidepool-bridge-derive.workspace = true
# Dev-dep cycle (tidepool-testing depends on this crate) — legal in Cargo;
# gives the roundtrip tests the shared standard_datacon_table.
tidepool-testing.workspace = true
