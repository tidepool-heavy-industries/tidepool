[package]
name = "tidepool-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Model Context Protocol (MCP) server for Tidepool"
readme = "../README.md"

[dependencies]
tidepool-codegen.workspace = true
tidepool-runtime.workspace = true
tidepool-eval.workspace = true
tidepool-repr.workspace = true
tidepool-effect.workspace = true
tidepool-actor.workspace = true
tidepool-tool.workspace = true
rmcp.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt-multi-thread", "signal", "sync", "test-util"] }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
parking_lot.workspace = true
dyn-clone = "1.0"
frunk.workspace = true
schemars.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
blake3.workspace = true

[dev-dependencies]
tidepool-protocol.workspace = true
# For the effectful integration tests: a capturing Console handler decoded the
# same way the production handler is (`tidepool/src/main.rs`).
tidepool-bridge.workspace = true
tidepool-bridge-derive.workspace = true
# Property tests for the pure eval-prep helpers (src/eval_prep.rs).
proptest.workspace = true
# Canonical extract_available()/prelude_path() guard for GHC-dependent tests.
tidepool-testing.workspace = true
tempfile.workspace = true
