[package]
name = "tidepool-harness"
description = "Typed-yield session tree over the tidepool eval substrate: forcing, event log, provider-driven turns"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
tidepool-repr = { path = "../tidepool-repr", version = "0.1.0" }
tidepool-runtime = { path = "../tidepool-runtime", version = "0.1.0" }
tidepool-mcp = { path = "../tidepool-mcp", version = "0.1.0" }
tidepool-handlers = { path = "../tidepool-handlers", version = "0.1.0" }
tidepool-eval = { path = "../tidepool-eval", version = "0.1.0" }
tidepool-effect = { path = "../tidepool-effect", version = "0.1.0" }
tidepool-bridge = { path = "../tidepool-bridge", version = "0.1.0" }
tidepool-codegen = { path = "../tidepool-codegen", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
genai = "0.5"
openai-auth = { version = "1", default-features = false, features = ["async", "callback-server"] }
reqwest = { version = "0.13", features = ["json", "form", "stream"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync"] }
parking_lot = "0.12"
tempfile = "3"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
