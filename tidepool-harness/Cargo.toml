[package]
name = "tidepool-harness"
description = "Typed-yield session tree over the tidepool eval substrate: forcing, event log, provider-driven turns"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
tidepool-actor.workspace = true
tidepool-atomic-write.workspace = true
tidepool-repr.workspace = true
tidepool-runtime.workspace = true
tidepool-mcp.workspace = true
tidepool-model-output.workspace = true
tidepool-model.workspace = true
tidepool-node.workspace = true
tidepool-handlers.workspace = true
tidepool-eval.workspace = true
tidepool-extract-cmd.workspace = true
tidepool-effect.workspace = true
tidepool-bridge.workspace = true
# `#[derive(FromCore)]` for the generated suspension-decode request enums
# under `src/generated/` — the same derive
# `tidepool-handlers`'s generated `<Eff>Req` enums use.
tidepool-bridge-derive.workspace = true
# The FromCore-capable bridge record types (`EvRepositoryEvent`/`WtWorktreeId`)
# tests decode RepoEvent/Worktree suspensions against.
tidepool-bridge-effects.workspace = true
tidepool-codegen.workspace = true
serde.workspace = true
serde_json.workspace = true
# Context-snapshot digests (`src/snapshot.rs`) — the workspace's one digest
# choice, already used by tidepool-runtime's compile cache and
# tidepool-handlers.
blake3.workspace = true
thiserror.workspace = true
genai.workspace = true
openai-auth = { version = "1", default-features = false, features = ["async", "callback-server"] }
reqwest = { workspace = true, features = ["form"] }
# `ReasoningTuningArgs` (`provider/oauth.rs`) is `clap::Args` so a binary's
# own entry point can `#[command(flatten)]` it — the "env" feature backs its
# `#[arg(env = "...")]` fields.
clap.workspace = true
base64 = "0.23"
uuid = { workspace = true, features = ["v5"] }
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "sync", "time"] }
# Bounded-concurrency stream combinator (`buffer_unordered`) for driving N
# concurrent fanout/fork RunLLMTurn answerer children without
# the `'static` requirement `tokio::spawn` would impose on borrowed driver
# state — already in the workspace's resolved graph (pulled in transitively
# by reqwest), pinned here as a direct dependency.
futures-util.workspace = true
parking_lot.workspace = true
tempfile.workspace = true
tracing.workspace = true
static_assertions.workspace = true

[dev-dependencies]
tempfile.workspace = true
trybuild.workspace = true
tidepool-testing.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }
# The outer-row Subagent acceptance (tests/outer_subagent.rs): a MockBackend-
# backed SubagentHandler + a TestRepo the curator spawns against.
tidepool-agent.workspace = true
tidepool-worktree.workspace = true
