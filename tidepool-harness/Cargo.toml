[package]
name = "tidepool-harness"
description = "Typed-yield session tree over the tidepool eval substrate: forcing, event log, provider-driven turns"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
tidepool-repr.workspace = true
tidepool-runtime.workspace = true
tidepool-mcp.workspace = true
tidepool-handlers.workspace = true
tidepool-eval.workspace = true
tidepool-extract-cmd.workspace = true
tidepool-effect.workspace = true
tidepool-bridge.workspace = true
tidepool-codegen.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
genai.workspace = true
openai-auth = { version = "1", default-features = false, features = ["async", "callback-server"] }
reqwest = { workspace = true, features = ["form"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "sync", "time"] }
# Bounded-concurrency stream combinator (`buffer_unordered`) for driving N
# concurrent fanout/fork RunLLMTurn answerer children (PRD 20 S1-L4) without
# the `'static` requirement `tokio::spawn` would impose on borrowed driver
# state — already in the workspace's resolved graph (pulled in transitively
# by reqwest), pinned here as a direct dependency.
futures-util = "0.3"
parking_lot.workspace = true
tempfile.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tidepool-testing.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }
# The outer-row Subagent acceptance (tests/outer_subagent.rs): a MockBackend-
# backed SubagentHandler + a TestRepo the curator spawns against.
tidepool-agent.workspace = true
tidepool-worktree.workspace = true
# The outer-row Console/Worktree/RepoEvent/Exec acceptance
# (tests/outer_effects.rs): a scripted `ObservationSource` over the wire
# `WtWorktreeId`/`EvRepositoryEvent` types.
tidepool-bridge-effects.workspace = true
