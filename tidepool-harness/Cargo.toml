[package]
name = "tidepool-harness"
description = "Typed-yield session tree over the tidepool eval substrate: forcing, event log, provider-driven turns"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
tidepool-repr = { path = "../tidepool-repr", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
genai = "0.5"
openai-auth = { version = "1", default-features = false, features = ["async", "callback-server"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time"] }
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
