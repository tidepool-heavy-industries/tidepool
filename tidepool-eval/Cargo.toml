[package]
name = "tidepool-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Tree-walking interpreter for Tidepool Core"
readme = "../README.md"

[dependencies]
tidepool-repr.workspace = true
tidepool-bignum.workspace = true
im = "15"
recursion.workspace = true
thiserror.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
# ISO-8601/RFC-3339 timestamp parsing for the `ParseISO8601` primop. No default
# features (no clock/tz — we only parse), just `alloc` for error strings.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Dev-dep cycle (tidepool-testing depends on this crate) — legal in Cargo;
# gives the suite tests the shared fixture loader.
tidepool-testing.workspace = true
