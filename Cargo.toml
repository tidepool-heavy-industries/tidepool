[workspace]
members = [
    "exomonad/jev-integration",
    "exomonad/actor",
    "exomonad/model-output",
    "exomonad/model",
    "exomonad/node",
    "exomonad/tool",
    "tidepool/repr",
    "tidepool/bignum",
    "bridge/testing",
    "bridge/test-data",
    "tidepool/prepared-corpus",
    "tidepool/heap",
    "tidepool/bridge",
    "tidepool/bridge-derive",
    "tidepool/bridge-effects",
    "tidepool/effect",
    "tidepool/extract-cmd",
    "tidepool/extract-report",
    "bridge/atomic-write",
    "tidepool/codegen",
    "tidepool/toolchain",
    "tidepool/runtime",
    "bridge/mcp",
    "bridge/protocol",
    "bridge/handlers",
    "exomonad/worktree",
    "exomonad/agent",
    "bridge/facade",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/tidepool-heavy-industries/tidepool"
homepage = "https://github.com/tidepool-heavy-industries/tidepool"
documentation = "https://docs.rs/tidepool"
authors = ["Inanna Malick <inanna@recursion.wtf>"]
rust-version = "1.89"

[workspace.dependencies]
codex-shoal-protocol = { path = "vendor/codex/codex-rs/shoal-protocol" }
tidepool-actor = { version = "0.1.0", path = "exomonad/actor" }
tidepool-agent = { version = "0.1.0", path = "exomonad/agent" }
tidepool-atomic-write = { path = "bridge/atomic-write" }
tidepool-bignum = { version = "0.1.0", path = "tidepool/bignum" }
tidepool-bridge = { version = "0.1.0", path = "tidepool/bridge" }
tidepool-bridge-derive = { version = "0.1.0", path = "tidepool/bridge-derive" }
tidepool-bridge-effects = { version = "0.1.0", path = "tidepool/bridge-effects" }
tidepool-codegen = { version = "0.1.0", path = "tidepool/codegen" }
tidepool-effect = { version = "0.1.0", path = "tidepool/effect" }
tidepool-extract-cmd = { version = "0.1.0", path = "tidepool/extract-cmd" }
tidepool-extract-report = { version = "0.1.0", path = "tidepool/extract-report" }
tidepool-handlers = { version = "0.1.0", path = "bridge/handlers" }
tidepool-heap = { version = "0.1.0", path = "tidepool/heap" }
tidepool-mcp = { version = "0.1.0", path = "bridge/mcp" }
tidepool-model-output = { version = "0.1.0", path = "exomonad/model-output" }
tidepool-model = { version = "0.1.0", path = "exomonad/model" }
tidepool-node = { version = "0.1.0", path = "exomonad/node" }
tidepool-tool = { version = "0.1.0", path = "exomonad/tool" }
tidepool-protocol = { version = "0.1.0", path = "bridge/protocol" }
tidepool-repr = { version = "0.1.0", path = "tidepool/repr" }
tidepool-runtime = { version = "0.1.0", path = "tidepool/runtime" }
tidepool-testing = { path = "bridge/testing" }
tidepool-test-data = { path = "bridge/test-data" }
tidepool-prepared-corpus = { path = "tidepool/prepared-corpus" }
tidepool-toolchain = { path = "tidepool/toolchain" }
tidepool-worktree = { path = "exomonad/worktree" }

axum = "0.8"
blake3 = "1"
camino = "1.2.5"
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
frunk = "0.5"
futures-util = "0.3"
genai = "0.6"
glob = "0.3"
inventory = "0.3"
libc = "0.2"
log = "0.4"
num-bigint = "0.4.8"
parking_lot = "0.12"
proc-macro2 = "1"
proptest = "1"
quote = "1"
ractor = { version = "0.16.5", default-features = false, features = ["tokio_runtime"] }
recursion = "0.5.4"
reqwest = { version = "0.13", features = ["json", "stream"] }
rustc-hash = "2.1.0"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serial_test = "3"
static_assertions = "1.1"
syn = { version = "3", features = ["full"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
trybuild = "1"
ureq = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

# Keep routine builds small: backtraces retain symbol names, but not file/line
# information. Opt into DWARF when debugging with CARGO_PROFILE_DEV_DEBUG=2
# (or CARGO_PROFILE_TEST_DEBUG=2) and CARGO_PROFILE_*_STRIP=none.
[profile.dev]
debug = 0
strip = "debuginfo"

# Dependencies (Cranelift, regalloc2, …) build at opt-level 2 even in
# dev/test — unoptimized deps make the JIT differential suites (hundreds of
# fixture compiles per run) take many minutes. Workspace crates stay at
# opt-level 0 for fast incremental compile.
[profile.dev.package."*"]
opt-level = 2

# The Cranelift backend and the Tidepool crates on its hot path (JIT codegen,
# prepared lowering and GC copy primitives) go to full optimization — they
# dominate per-fixture JIT compile time and per-turn latency.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-jit]
opt-level = 3
[profile.dev.package.cranelift-module]
opt-level = 3
[profile.dev.package.cranelift-native]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-bitset]
opt-level = 3
[profile.dev.package.cranelift-control]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.tidepool-codegen]
opt-level = 3
[profile.dev.package.tidepool-repr]
opt-level = 3
[profile.dev.package.tidepool-heap]
opt-level = 3

[profile.test]
debug = 0
strip = "debuginfo"
