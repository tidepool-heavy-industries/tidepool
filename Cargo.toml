[workspace]
members = [
    "tidepool-actor",
    "tidepool-model-output",
    "tidepool-model",
    "tidepool-node",
    "tidepool-repr",
    "tidepool-bignum",
    "tidepool-eval",
    "tidepool-testing",
    "tidepool-heap",
    "tidepool-optimize",
    "tidepool-bridge",
    "tidepool-bridge-derive",
    "tidepool-bridge-effects",
    "tidepool-macro",
    "tidepool-effect",
    "tidepool-extract-cmd",
    "tidepool-extract-report",
    "tidepool-atomic-write",
    "tidepool-codegen",
    "tidepool-toolchain",
    "tidepool-runtime",
    "tidepool-mcp",
    "tidepool-protocol",
    "tidepool-handlers",
    "tidepool-repl",
    "tidepool-harness",
    "tidepool-worktree",
    "tidepool-agent",
    "tidepool-web",
    "tidepool",
    "examples/guess",
    "examples/tide",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/tidepool-heavy-industries/tidepool"
homepage = "https://github.com/tidepool-heavy-industries/tidepool"
documentation = "https://docs.rs/tidepool"
authors = ["Inanna Malick <inanna@recursion.wtf>"]
rust-version = "1.89"

[workspace.dependencies]
tidepool-actor = { version = "0.1.0", path = "tidepool-actor" }
tidepool-agent = { version = "0.1.0", path = "tidepool-agent" }
tidepool-atomic-write = { path = "tidepool-atomic-write" }
tidepool-bignum = { version = "0.1.0", path = "tidepool-bignum" }
tidepool-bridge = { version = "0.1.0", path = "tidepool-bridge" }
tidepool-bridge-derive = { version = "0.1.0", path = "tidepool-bridge-derive" }
tidepool-bridge-effects = { version = "0.1.0", path = "tidepool-bridge-effects" }
tidepool-codegen = { version = "0.1.0", path = "tidepool-codegen" }
tidepool-effect = { version = "0.1.0", path = "tidepool-effect" }
tidepool-eval = { version = "0.1.0", path = "tidepool-eval" }
tidepool-extract-cmd = { version = "0.1.0", path = "tidepool-extract-cmd" }
tidepool-extract-report = { version = "0.1.0", path = "tidepool-extract-report" }
tidepool-handlers = { version = "0.1.0", path = "tidepool-handlers" }
tidepool-harness = { version = "0.1.0", path = "tidepool-harness" }
tidepool-heap = { version = "0.1.0", path = "tidepool-heap" }
tidepool-macro = { version = "0.1.0", path = "tidepool-macro" }
tidepool-mcp = { version = "0.1.0", path = "tidepool-mcp" }
tidepool-model-output = { version = "0.1.0", path = "tidepool-model-output" }
tidepool-model = { version = "0.1.0", path = "tidepool-model" }
tidepool-node = { version = "0.1.0", path = "tidepool-node" }
tidepool-optimize = { version = "0.1.0", path = "tidepool-optimize" }
tidepool-protocol = { version = "0.1.0", path = "tidepool-protocol" }
tidepool-repr = { version = "0.1.0", path = "tidepool-repr" }
tidepool-runtime = { version = "0.1.0", path = "tidepool-runtime" }
tidepool-testing = { path = "tidepool-testing" }
tidepool-toolchain = { path = "tidepool-toolchain" }
tidepool-web = { path = "tidepool-web" }
tidepool-worktree = { path = "tidepool-worktree" }

axum = "0.8"
blake3 = "1"
camino = "1.2.5"
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
frunk = "0.5"
futures-util = "0.3"
genai = "0.6"
glob = "0.3"
inventory = "0.3"
libc = "0.2"
log = "0.4"
parking_lot = "0.12"
proc-macro2 = "1"
proptest = "1"
quote = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
rmcp = { version = "0.16", features = ["server", "transport-io", "transport-streamable-http-server"] }
rustc-hash = "2.1.0"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serial_test = "3"
static_assertions = "1.1"
syn = { version = "3", features = ["full"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
trybuild = "1"
ureq = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

# debug = 1: line tables only (no full DWARF). RUST_BACKTRACE=full still
# resolves file:line per frame this way; full DWARF costs real disk per
# binary given this workspace statically links Cranelift plus the full
# effect/runtime/harness stack. Same rationale for [profile.test] below.
[profile.dev]
debug = 1

# Dependencies (Cranelift, regalloc2, …) build at opt-level 2 even in
# dev/test — unoptimized deps make the JIT differential suites (hundreds of
# fixture compiles per run) take many minutes. Workspace crates stay at
# opt-level 0 for fast incremental compile.
[profile.dev.package."*"]
opt-level = 2

# The Cranelift backend and the Tidepool crates on its hot path (JIT codegen,
# Core tree walks, GC copy primitives) go to full optimization — they
# dominate per-fixture JIT compile time and per-turn latency.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-jit]
opt-level = 3
[profile.dev.package.cranelift-module]
opt-level = 3
[profile.dev.package.cranelift-native]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-bitset]
opt-level = 3
[profile.dev.package.cranelift-control]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.tidepool-codegen]
opt-level = 3
[profile.dev.package.tidepool-repr]
opt-level = 3
[profile.dev.package.tidepool-heap]
opt-level = 3

# tidepool-eval/tidepool-optimize are hot in the differential suites (eval
# oracle tree walk, optimizer over the corpus) but not the dogfooding runtime
# path, so only `cargo test` pays their optimized rebuild — a normal `cargo
# build`/edit loop stays at the `package."*"` default above.
[profile.test.package.tidepool-eval]
opt-level = 3
[profile.test.package.tidepool-optimize]
opt-level = 3

[profile.test]
debug = 1
