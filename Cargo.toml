[workspace]
members = [
    "tidepool-repr",
    "tidepool-bignum",
    "tidepool-eval",
    "tidepool-testing",
    "tidepool-heap",
    "tidepool-optimize",
    "tidepool-bridge",
    "tidepool-bridge-derive",
    "tidepool-bridge-effects",
    "tidepool-macro",
    "tidepool-effect",
    "tidepool-codegen",
    "tidepool-runtime",
    "tidepool-mcp",
    "tidepool-handlers",
    "tidepool-repl",
    "tidepool-lsp",
    "tidepool-harness",
    "tidepool-web",
    "tidepool",
    "examples/guess",
    "examples/tide",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tidepool-heavy-industries/tidepool"
homepage = "https://github.com/tidepool-heavy-industries/tidepool"
documentation = "https://docs.rs/tidepool"
authors = ["Inanna Malick <inanna@recursion.wtf>"]
rust-version = "1.89"

# --- gen-workspace-deps: BEGIN (generated by scripts/gen-workspace-deps.py; do not hand-edit) ---
[workspace.dependencies]
tidepool-bignum = { version = "0.1.0", path = "tidepool-bignum" }
tidepool-bridge = { version = "0.1.0", path = "tidepool-bridge" }
tidepool-bridge-derive = { version = "0.1.0", path = "tidepool-bridge-derive" }
tidepool-bridge-effects = { version = "0.1.0", path = "tidepool-bridge-effects" }
tidepool-codegen = { version = "0.1.0", path = "tidepool-codegen" }
tidepool-effect = { version = "0.1.0", path = "tidepool-effect" }
tidepool-eval = { version = "0.1.0", path = "tidepool-eval" }
tidepool-handlers = { version = "0.1.0", path = "tidepool-handlers" }
tidepool-harness = { version = "0.1.0", path = "tidepool-harness" }
tidepool-heap = { version = "0.1.0", path = "tidepool-heap" }
tidepool-macro = { version = "0.1.0", path = "tidepool-macro" }
tidepool-mcp = { version = "0.1.0", path = "tidepool-mcp" }
tidepool-optimize = { version = "0.1.0", path = "tidepool-optimize" }
tidepool-repr = { version = "0.1.0", path = "tidepool-repr" }
tidepool-runtime = { version = "0.1.0", path = "tidepool-runtime" }
tidepool-testing = { path = "tidepool-testing" }

axum = "0.8"
blake3 = "1"
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
frunk = "0.4"
genai = "0.5"
glob = "0.3"
inventory = "0.3"
libc = "0.2"
log = "0.4"
parking_lot = "0.12"
proc-macro2 = "1"
proptest = "1"
quote = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
rmcp = { version = "0.16", features = ["server", "transport-io", "transport-streamable-http-server"] }
rustc-hash = "2.1.0"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serial_test = "3"
syn = { version = "2", features = ["full"] }
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ureq = "2"
url = "2"
which = "7"
# --- gen-workspace-deps: END ---

# Optimize DEPENDENCIES (Cranelift, regalloc2, …) even in dev/test builds.
# The JIT differential suites JIT-compile hundreds of fixtures per run (738 and
# growing) via cranelift-codegen; at opt-level 0 each of those compiles runs
# unoptimized Cranelift and the suite takes many minutes. Workspace crates stay
# at opt-level 0 for fast incremental compile — only the deps (built once and
# cached) are optimized. This cuts the differential/eval test wall-clock sharply
# without slowing the edit→compile loop on our own crates.
[profile.dev.package."*"]
opt-level = 2

# The hottest JIT-path crates go to full optimization: Cranelift's emit
# pipeline and regalloc dominate per-fixture JIT compile time behind every
# differential suite and harness turn. External crates rebuild once and cache.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-jit]
opt-level = 3
[profile.dev.package.cranelift-module]
opt-level = 3
[profile.dev.package.cranelift-native]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-bitset]
opt-level = 3
[profile.dev.package.cranelift-control]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3

# Also optimize the JIT/interpreter hot crates for `cargo test` specifically,
# where their RUNTIME dominates (Cranelift emit + tree-walk over the corpus).
# Kept out of plain `[profile.dev]` so a normal `cargo build`/edit loop on these
# crates stays fast; `cargo test` pays a one-time optimized rebuild of just these.
[profile.test.package.tidepool-codegen]
opt-level = 3
[profile.test.package.tidepool-eval]
opt-level = 3
[profile.test.package.tidepool-heap]
opt-level = 3
[profile.test.package.tidepool-optimize]
opt-level = 3

# Line tables only (no full DWARF) for the crate under test and its test
# targets: RUST_BACKTRACE=full still resolves file:line per frame; debug = 0
# drops per-frame file:line entirely, keeping only the panic site itself.
[profile.test]
debug = 1
