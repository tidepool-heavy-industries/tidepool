[workspace]
members = [
    "tidepool-repr",
    "tidepool-bignum",
    "tidepool-eval",
    "tidepool-testing",
    "tidepool-heap",
    "tidepool-optimize",
    "tidepool-bridge",
    "tidepool-bridge-derive",
    "tidepool-bridge-effects",
    "tidepool-macro",
    "tidepool-effect",
    "tidepool-extract-cmd",
    "tidepool-codegen",
    "tidepool-runtime",
    "tidepool-mcp",
    "tidepool-protocol",
    "tidepool-handlers",
    "tidepool-repl",
    "tidepool-lsp",
    "tidepool-harness",
    "tidepool-worktree",
    "tidepool-agent",
    "tidepool-web",
    "tidepool",
    "examples/guess",
    "examples/tide",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tidepool-heavy-industries/tidepool"
homepage = "https://github.com/tidepool-heavy-industries/tidepool"
documentation = "https://docs.rs/tidepool"
authors = ["Inanna Malick <inanna@recursion.wtf>"]
rust-version = "1.89"

# --- gen-workspace-deps: BEGIN (generated by scripts/gen-workspace-deps.py; do not hand-edit) ---
[workspace.dependencies]
tidepool-agent = { version = "0.1.0", path = "tidepool-agent" }
tidepool-bignum = { version = "0.1.0", path = "tidepool-bignum" }
tidepool-bridge = { version = "0.1.0", path = "tidepool-bridge" }
tidepool-bridge-derive = { version = "0.1.0", path = "tidepool-bridge-derive" }
tidepool-bridge-effects = { version = "0.1.0", path = "tidepool-bridge-effects" }
tidepool-codegen = { version = "0.1.0", path = "tidepool-codegen" }
tidepool-effect = { version = "0.1.0", path = "tidepool-effect" }
tidepool-eval = { version = "0.1.0", path = "tidepool-eval" }
tidepool-extract-cmd = { version = "0.1.0", path = "tidepool-extract-cmd" }
tidepool-handlers = { version = "0.1.0", path = "tidepool-handlers" }
tidepool-harness = { version = "0.1.0", path = "tidepool-harness" }
tidepool-heap = { version = "0.1.0", path = "tidepool-heap" }
tidepool-macro = { version = "0.1.0", path = "tidepool-macro" }
tidepool-mcp = { version = "0.1.0", path = "tidepool-mcp" }
tidepool-optimize = { version = "0.1.0", path = "tidepool-optimize" }
tidepool-protocol = { version = "0.1.0", path = "tidepool-protocol" }
tidepool-repr = { version = "0.1.0", path = "tidepool-repr" }
tidepool-runtime = { version = "0.1.0", path = "tidepool-runtime" }
tidepool-testing = { path = "tidepool-testing" }
tidepool-worktree = { path = "tidepool-worktree" }

axum = "0.8"
blake3 = "1"
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
frunk = "0.5"
futures-util = "0.3"
genai = "0.6"
glob = "0.3"
inventory = "0.3"
libc = "0.2"
log = "0.4"
parking_lot = "0.12"
proc-macro2 = "1"
proptest = "1"
quote = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
rmcp = { version = "0.16", features = ["server", "transport-io", "transport-streamable-http-server"] }
rustc-hash = "2.1.0"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serial_test = "3"
static_assertions = "1.1"
syn = { version = "3", features = ["full"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
trybuild = "1"
ureq = "2"
url = "2"
# --- gen-workspace-deps: END ---

# Optimize DEPENDENCIES (Cranelift, regalloc2, …) even in dev/test builds.
# The JIT differential suites JIT-compile hundreds of fixtures per run (738 and
# growing) via cranelift-codegen; at opt-level 0 each of those compiles runs
# unoptimized Cranelift and the suite takes many minutes. Workspace crates stay
# at opt-level 0 for fast incremental compile — only the deps (built once and
# cached) are optimized. This cuts the differential/eval test wall-clock sharply
# without slowing the edit→compile loop on our own crates.
[profile.dev.package."*"]
opt-level = 2

# The hottest JIT-path crates go to full optimization: Cranelift's emit
# pipeline and regalloc dominate per-fixture JIT compile time behind every
# differential suite and harness turn. External crates rebuild once and cache.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-jit]
opt-level = 3
[profile.dev.package.cranelift-module]
opt-level = 3
[profile.dev.package.cranelift-native]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-bitset]
opt-level = 3
[profile.dev.package.cranelift-control]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3

# The Tidepool half of that same hot path. `harness-dogfooding/run.sh` launches
# the DEV profile, so a real turn ran its IR translation (tidepool-codegen's
# emit::expr, wrap_with_datacon_env) and its Core tree walks (tidepool-repr's
# free_vars/extract_subtree) at the `package."*"` opt-level 2 default while the
# Cranelift backend underneath ran at 3. Turn-latency stage attribution puts
# jit_codegen at 2.7-4.4s per turn on that profile — the mismatch is the cheap
# part of it. tidepool-heap rides along: the GC copy primitives are on the same
# per-turn path.
#
# This is the edit-loop cost the [profile.test.package] block below was
# deliberately avoiding for these crates; taken now because the dogfooding
# runtime is the thing being optimized, and a rebuild of three crates is
# cheaper than 2.7s a turn. The algorithmic causes (per-turn constructor
# re-emission, the quadratic DCE scan) are a separate wave.
[profile.dev.package.tidepool-codegen]
opt-level = 3
[profile.dev.package.tidepool-repr]
opt-level = 3
[profile.dev.package.tidepool-heap]
opt-level = 3

# Optimized for `cargo test` only: these two are hot in the differential
# suites (the eval oracle's tree walk, the optimizer over the corpus) but not
# on the dogfooding runtime path, so a normal `cargo build`/edit loop on them
# stays at the `package."*"` default and only `cargo test` pays the optimized
# rebuild. tidepool-codegen and tidepool-heap used to be listed here too;
# they now carry opt-level 3 in `[profile.dev.package]` above, which the test
# profile inherits (verified: a `--tests` build of a crate with a dev-profile
# override and no test-profile one compiles at `-C opt-level=3`).
[profile.test.package.tidepool-eval]
opt-level = 3
[profile.test.package.tidepool-optimize]
opt-level = 3

# Line tables only (no full DWARF) for the crate under test and its test
# targets: RUST_BACKTRACE=full still resolves file:line per frame; debug = 0
# drops per-frame file:line entirely, keeping only the panic site itself.
[profile.test]
debug = 1
