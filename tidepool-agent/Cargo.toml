[package]
name = "tidepool-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Typed headless-subagent backend adapters (PRD 18). Backend vocabulary is contained here."

[dependencies]
codex-codes = "=0.146.4"
# pidfd_open/pidfd_send_signal + poll for the app-server canceller: a cycle
# thread blocked in a seam call holds `&mut` on its backend, so reaping it
# from another thread goes by pidfd (see driver.rs's PidFdSlot docs).
rustix = { version = "1", features = ["process", "event"] }
tidepool-worktree.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "rt", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile.workspace = true
