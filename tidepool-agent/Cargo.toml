[package]
name = "tidepool-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Typed headless-subagent backend adapters (PRD 18). Backend vocabulary is contained here."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
tidepool-model.workspace = true
codex-codes = "=0.146.4"
# The shared readable-executable-file check (std-only zero-dep leaf) — see
# process.rs's is_readable_executable_file.
tidepool-extract-cmd.workspace = true
tidepool-atomic-write.workspace = true
tidepool-tool.workspace = true
# pidfd_open/pidfd_send_signal + poll for the app-server canceller: a cycle
# thread blocked in a seam call holds `&mut` on its backend, so reaping it
# from another thread goes by pidfd (see driver.rs's PidFdSlot docs).
rustix = { version = "1", features = ["process", "event"] }
parking_lot.workspace = true
tidepool-repr.workspace = true
tidepool-worktree.workspace = true
serde.workspace = true
serde_json.workspace = true
# UTF-8-checked paths at the Haskell/wire boundary (camino-utf8-paths lane).
camino.workspace = true
sha2 = "0.11"
thiserror.workspace = true
toml_edit = "0.25.11"
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
