[package]
autotests = false
name = "tidepool-mcp"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Effect declarations, Haskell source assembly, and validation for Tidepool"
readme = "../../README.md"

[[bin]]
name = "tidepool-effects-gen"
path = "src/bin/tidepool-effects-gen.rs"
test = false

[dependencies]
tidepool-atomic-write.workspace = true
tidepool-runtime.workspace = true
tidepool-toolchain.workspace = true
parking_lot.workspace = true
frunk.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
blake3.workspace = true

[dev-dependencies]
tempfile.workspace = true
tidepool-repr.workspace = true
tidepool-effect.workspace = true
tidepool-protocol.workspace = true
tidepool-testing.workspace = true
# For the effectful integration tests: a capturing Console handler decoded the
# same way the production handler is (`bridge/facade/src/main.rs`).
tidepool-bridge.workspace = true
tidepool-bridge-derive.workspace = true
# Property tests for the pure eval-prep helpers (src/eval_prep.rs).
proptest.workspace = true

[[test]]
name = "mcp"
path = "tests/suites/mcp.rs"

[lints]
workspace = true
