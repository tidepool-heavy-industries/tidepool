[package]
name = "tidepool-handlers"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Concrete effect handlers for Tidepool (Console/KV/Fs/SG/Http/Exec/Llm/Meta)"

[dependencies]
tidepool-mcp.workspace = true
tidepool-effect.workspace = true
tidepool-runtime.workspace = true
tidepool-repr.workspace = true
tidepool-bridge.workspace = true
tidepool-bridge-derive.workspace = true
tidepool-bridge-effects.workspace = true
# UTF-8-checked paths at the Haskell/wire boundary — decode PathBuf once with
# a typed error instead of a silent lossy conversion (camino-utf8-paths lane).
camino.workspace = true
# PRD 19 lane L4: the RepoEvent handler's production observation source adapts
# `WorktreeMonitor` — the git reasoning lives THERE, not here.
exomonad-worktree.workspace = true
# PRD 18 lane 1: the Subagent handler drives the coupled-spawn saga — the
# saga and backend seam live THERE, not here.
exomonad-agent.workspace = true
# Exec's process launcher: host_command::command is the one allowed
# std::process::Command::new for an arbitrary caller-named command with its
# own process-group timeout/kill (see handlers/exec.rs).
exomonad-node.workspace = true
# Jev/System One handler: resolves TYPESAFE_API_KEY via the shared config/secrets
# path resolver (see `tidepool-toolchain::paths::secrets_dir`).
tidepool-toolchain.workspace = true
frunk.workspace = true
# Native deps moved from tidepool/Cargo.toml
glob.workspace = true
# Gitignore-aware exclusion for the glob/grep walk (#343) — ripgrep's own
# gitignore matcher, so expand_glob's default exclusions match `rg`'s.
ignore = "0.4"
parking_lot.workspace = true
regex = "1"
genai.workspace = true
ureq = { workspace = true, features = ["json"] }
url.workspace = true
# Process-group SIGKILL on Exec timeout (Unix only — see `handlers/exec.rs`).
libc.workspace = true
# Direct deps for handler implementations
serde_json.workspace = true
uuid.workspace = true
# Content hashing for the Fs compare-and-swap write (FsHash/FsWriteCas) —
# matches the cache layer's blake3 choice (tidepool-runtime).
blake3.workspace = true
tracing.workspace = true
thiserror.workspace = true
# build_base_stack requires a tokio runtime (LlmHandler captures Handle::current())
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "macros"] }
# Jev/System One HTTP client: no redirects, no retries, streamed body with a
# hard cap — mirrors `jev-integration/src/transport.rs`.
reqwest.workspace = true

[dev-dependencies]
tidepool-testing.workspace = true
tidepool-test-data.workspace = true
tempfile.workspace = true

[lints]
workspace = true
