[package]
name = "tidepool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Compile Haskell effect stacks to Cranelift JIT, drive from Rust"
readme = "../README.md"
keywords = ["haskell", "jit", "cranelift", "effects", "compiler"]
categories = ["compilers"]

[[bin]]
name = "tidepool"
path = "src/main.rs"

[dependencies]
tidepool-repr.workspace = true
tidepool-eval.workspace = true
tidepool-heap.workspace = true
tidepool-optimize.workspace = true
tidepool-bridge.workspace = true
tidepool-bridge-derive.workspace = true
tidepool-effect.workspace = true
tidepool-codegen.workspace = true
tidepool-macro.workspace = true
tidepool-runtime.workspace = true
tidepool-mcp.workspace = true
tidepool-handlers.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tracing.workspace = true
clap.workspace = true
axum.workspace = true
rmcp.workspace = true


[dev-dependencies]
tempfile.workspace = true
