[package]
autobins = false
name = "exomonad-web"
description = "Minimal operator GUI (HTTP+SSE, Datastar) for the self-iterating harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
clap.workspace = true
exomonad-harness.workspace = true
tidepool-repr.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
maud = "0.27"
datastar = { version = "0.3", features = ["axum"] }
axum.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-core = "0.3"

[dev-dependencies]
reqwest.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "test-util", "time"] }
futures-util.workspace = true
