[package]
name = "exomonad-agent"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Typed headless-subagent backend adapters (PRD 18). Backend vocabulary is contained here."

[features]
default = ["codex-compat"]
codex-compat = [
    "dep:codex-codes",
    "dep:codex-shoal-protocol",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:rustix",
    "dep:tidepool-atomic-write",
    "dep:tidepool-extract-cmd",
    "dep:toml_edit",
    "dep:uuid",
    "dep:chrono",
]

[dependencies]
codex-shoal-protocol = { workspace = true, optional = true }
chrono = { version = "0.4", default-features = false, features = ["alloc"], optional = true }
exomonad-model.workspace = true
tidepool-bridge-effects.workspace = true
codex-codes = { version = "=0.146.4", optional = true }
# The shared readable-executable-file check (std-only zero-dep leaf) — see
# process.rs's is_readable_executable_file.
tidepool-extract-cmd = { workspace = true, optional = true }
tidepool-atomic-write = { workspace = true, optional = true }
exomonad-tool.workspace = true
# pidfd_open/pidfd_send_signal + poll for the app-server canceller: a cycle
# thread blocked in a seam call holds `&mut` on its backend, so reaping it
# from another thread goes by pidfd (see driver.rs's PidFdSlot docs).
rustix = { version = "1", features = ["process", "event"], optional = true }
parking_lot.workspace = true
tidepool-repr.workspace = true
exomonad-worktree.workspace = true
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
serde.workspace = true
serde_json.workspace = true
# UTF-8-checked paths at the Haskell/wire boundary (camino-utf8-paths lane).
camino.workspace = true
sha2 = "0.11"
thiserror.workspace = true
toml_edit = { version = "0.25.11", optional = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "time"] }
tracing.workspace = true
uuid = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
