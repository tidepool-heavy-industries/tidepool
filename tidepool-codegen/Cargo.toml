[package]
name = "tidepool-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Cranelift-based JIT compiler for Tidepool Core"
readme = "../README.md"

[dependencies]
cranelift-codegen = "=0.129.1"
cranelift-frontend = "=0.129.1"
cranelift-jit = "=0.129.1"
cranelift-module = "=0.129.1"
cranelift-native = "=0.129.1"
tidepool-repr.workspace = true
tidepool-bignum.workspace = true
tidepool-heap.workspace = true
tidepool-eval.workspace = true
tidepool-bridge.workspace = true
tidepool-effect.workspace = true
thiserror.workspace = true
log.workspace = true
env_logger = "0.11"
parking_lot.workspace = true
recursion = "0.5.4"
rustc-hash.workspace = true
# Dependency-graph traversal + topological sort for LetRec deferred-simple
# binding order (emit/expr.rs's `topo_sort_deferred_simple`). Project-wide
# hard directive: petgraph for graph algorithms, never hand-rolled.
petgraph = "0.8"
# Stack-growth insurance at the emit recursion spine (emit_node). Tiny, widely
# vendored (rustc itself uses it). NEW external dep — sanctioned for the
# stack-safety pass; flagged for human veto at merge.
stacker = "0.1"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
cc = "1"

[dev-dependencies]
proptest.workspace = true
serial_test.workspace = true
tidepool-testing.workspace = true
# Test-only: the real `DispatchEffect` impls live exclusively on frunk's
# HCons/HNil. proptest_jit_dispatch.rs must drive BOTH the JIT machine and the
# eval EffectMachine through genuine handler HLists to differentially test the
# dispatch loop and tag routing; there is no reachable re-export. Dev-dep only —
# production crate graph is unchanged.
frunk.workspace = true
