[package]
name = "tidepool-testing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Testing utilities and benchmarks for Tidepool"
publish = false

[dependencies]
tidepool-repr.workspace = true
tidepool-eval.workspace = true
tidepool-heap.workspace = true
tidepool-optimize.workspace = true
tidepool-codegen.workspace = true
proptest = "1.10.0"
serde_json.workspace = true
tidepool-runtime.workspace = true
tidepool-mcp.workspace = true
tidepool-effect.workspace = true
tidepool-bridge.workspace = true
tidepool-bridge-derive.workspace = true
tidepool-bridge-effects.workspace = true
frunk.workspace = true
libc.workspace = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "eval"
harness = false

[[bench]]
name = "optimize"
harness = false

[[bench]]
name = "codegen"
harness = false

[[test]]
name = "haskell_verified"
path = "tests/haskell_verified/mod.rs"

