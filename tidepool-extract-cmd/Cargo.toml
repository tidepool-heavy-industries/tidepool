[package]
name = "tidepool-extract-cmd"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/tidepool-heavy-industries/tidepool"
homepage = "https://github.com/tidepool-heavy-industries/tidepool"
authors = ["Inanna Malick <inanna@recursion.wtf>"]
rust-version = "1.89"
description = "The one builder for `tidepool-extract` invocations: binary resolution, typed arguments, the spawn, and the process-global spawn counter"

[[bin]]
name = "tidepool-extract"
path = "src/main.rs"

# Endpoint identity is captured beside the process boundary.  A strong digest
# is required because returning mutable producer paths would recreate the
# identity/execution race this crate owns.  `blake3` is already in the proc
# macro's build graph; keeping the digest here avoids any runtime dependency.
[dependencies]
blake3 = "=1.8.6"
