[package]
name = "tidepool-repl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "GHCi-style session MCP server for Tidepool (resident JIT machine across turns)"
readme = "../README.md"

[[bin]]
name = "tidepool-repl"
path = "src/main.rs"

[lib]
name = "tidepool_repl"
path = "src/lib.rs"

[dependencies]
tidepool-repr.workspace = true
tidepool-eval.workspace = true
tidepool-effect.workspace = true
tidepool-codegen.workspace = true
tidepool-runtime.workspace = true
tidepool-mcp.workspace = true
tidepool-handlers.workspace = true
tidepool-bridge.workspace = true
rmcp.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["io-util", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
frunk.workspace = true
schemars.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true
tidepool-testing.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }
