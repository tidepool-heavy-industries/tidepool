[package]
name = "tidepool-web"
description = "Minimal operator GUI (HTTP+SSE, Datastar) for the self-iterating harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
tidepool-harness = { path = "../tidepool-harness", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
maud = "0.27"
datastar = { version = "0.3", features = ["axum"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-core = "0.3"

[[bin]]
name = "tidepool-selfharness"
path = "src/bin/tidepool-selfharness.rs"

[[bin]]
name = "tidepool-selfharness-web"
path = "src/bin/tidepool-selfharness-web.rs"

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "test-util"] }
futures-util = "0.3"
