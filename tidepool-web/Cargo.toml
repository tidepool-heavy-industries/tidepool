[package]
name = "tidepool-web"
description = "Protocol server (HTTP+SSE) + Datastar observatory over tidepool-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
tidepool-harness = { path = "../tidepool-harness", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
maud = "0.27"
datastar = { version = "0.3", features = ["axum"] }
pulldown-cmark = "0.13"
percent-encoding = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-stream = "0.1"
futures-core = "0.3"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tidepool-harness"
path = "src/bin/tidepool-harness.rs"

[[bin]]
name = "tidepool-selfharness"
path = "src/bin/tidepool-selfharness.rs"
