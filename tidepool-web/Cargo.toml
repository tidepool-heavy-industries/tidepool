[package]
name = "tidepool-web"
description = "Minimal operator GUI (HTTP+SSE, Datastar) for the self-iterating harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
clap.workspace = true
tidepool-harness.workspace = true
tidepool-runtime.workspace = true
# The tidepool-selfharness binary's subagent seam (TIDEPOOL_MEMORY_REPO):
# the driver-owned SubagentHandler + the live Codex backend. S1-L1 widens
# this to the Console/Worktree/RepoEvent/Exec handlers, needing
# tidepool-worktree directly for WorktreeMonitor/EventJournal/GitCli.
tidepool-handlers.workspace = true
tidepool-agent.workspace = true
tidepool-worktree.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
maud = "0.27"
datastar = { version = "0.3", features = ["axum"] }
axum.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-core = "0.3"
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[[bin]]
name = "tidepool-selfharness"
path = "src/bin/tidepool-selfharness.rs"

[[bin]]
name = "tidepool-selfharness-web"
path = "src/bin/tidepool-selfharness-web.rs"

[dev-dependencies]
tidepool-testing.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "test-util", "time"] }
futures-util.workspace = true
tempfile.workspace = true
