# Watched-tests manifest.
#
# Every GHC-heavy crate's `tests/*.rs` integration binary must be registered
# here, one `binary = "what it pins"` line per file stem. Enforced by
# `tidepool-testing`'s `watched_tests::tests::watched_tests_manifest_covers_every_ghc_heavy_binary`
# lib unit test, which runs on every quick-tier `cargo nextest run` (it is a
# `kind(lib)` test, not a `tests/*.rs` integration binary, so nextest.toml's
# default-filter does not exclude it) and enumerates each crate's tests/
# directory, failing fast on any binary absent from its section below.
#
# Seeded from plans/self-iterating-harness/trunk-battery-sweep-2026-08-18.md's
# inventory (2026-08-18), which found 32 of 33 tidepool-harness binaries
# reachable only through the wholesale crate shard — unwatched by any
# narrower, faster, more-often-run check. Add a line here when a spec adds or
# renames a tests/*.rs integration binary in a GHC-heavy crate; the note can
# start as terse as a clause — completeness of coverage matters more than
# prose depth.
#
# NOT listed here (excluded from the required set by the check itself, kept
# in sync with .config/nextest.toml's per-binary exceptions):
#   tidepool-harness/provider_behavior — the sole quick-tier exception
#     (pure-Rust, no extract/Harness use); already runs on every quick check.
#   tidepool-web/operator_gate, tidepool-web/form_api — pure HTTP/SSE tests
#     that already run in the quick tier; only crash_recovery is GHC-heavy.

