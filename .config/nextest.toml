# scripts/battery.sh runs each test in a separate nextest process, isolating
# process-global JIT signals, GC state, and fork-safety machinery.
# The ghc-heavy group caps test processes that compile Haskell. It does not
# limit Cargo builds; default-filter controls execution, not compilation.

[profile.default]
# Global test timeout: warn once a test has run past `period`, hard-kill it
# after `terminate-after` further periods. Sized for the heaviest
# differential/proptest suites under moderate machine contention.
slow-timeout = { period = "60s", terminate-after = 30 }

# Default tier omits extractor-heavy packages, integration targets, and
# selected actor-host campaigns. It still includes mixed tidepool targets;
# ghc-heavy bounds their compiler concurrency independently. Package selection
# intersects this filter.
#
default-filter = 'not (package(tidepool-runtime) | package(tidepool-handlers) | (package(tidepool-testing) & kind(test)) | (package(tidepool-actor) & kind(test)) | (package(tidepool) & (test(typed_reply_settles_response_and_wakes_registered_watch) | test(progress_retains_closures_and_watch_snapshots_across_calls) | test(actor_host::documentation_tests))))'

# The battery scripts (`just verify`, `just test-target`, `just suite`) run
# every registered tier.
[profile.battery]
default-filter = 'all()'

# GHC-heavy tests run below full core count so concurrent extractor requests do
# not oversubscribe CPU and memory. This is a per-run limit; callers running
# several batteries concurrently must budget their aggregate load.
[test-groups.ghc-heavy]
max-threads = 4

# Default-deny: everything is GHC-heavy unless it appears in the exemption
# filter below. An entry is removed from the cap only after showing
# its tests do no `extract` work (no tidepool-extract spawn, no
# EvalHarness/Harness turn).
[[profile.default.overrides]]
filter = 'not (package(tidepool-repr) | package(tidepool-heap) | package(tidepool-bignum) | package(tidepool-effect) | package(tidepool-bridge) | package(tidepool-bridge-derive) | package(tidepool-bridge-effects) | package(tidepool-codegen) | (package(tidepool) & !binary(shoal_action_surface) & !(test(actor_host::) | test(host_dynamic_tools::drain_tests::actual_seal) | test(operator::tests::unix_http_live_workbench_and_graph))) | (package(tidepool-testing) & !kind(test)) | (package(tidepool-actor) & !kind(test) & !test(resident_interactive::lifecycle_tests)))'
test-group = 'ghc-heavy'
