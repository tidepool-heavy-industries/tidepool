# cargo-nextest config. See tidepool CLAUDE.md "Build & Test" for the invocation
# (TIDEPOOL_EXTRACT env, etc). nextest runs every test in its OWN process,
# which structurally de-races the JIT's process-global state (signal
# handlers, GC, fork-safety harnesses) — replacing the old blanket
# `-- --test-threads=1` discipline.
#
# HAZARD AUDIT: the historical case-by-case audit of which tests touch
# process-global JIT/GC state, and why none of those hazards are cross-process
# (so nextest's one-process-per-test model resolves them), lives in this
# file's git history (nextest-adoption branch) rather than inline here.
#
# `cargo check --workspace --all-targets` and a default `cargo nextest run`
# still BUILD every GHC-heavy target: `haskell_eval!`/`haskell_inline!` run
# tidepool-extract during macro EXPANSION, i.e. at build (rustc) time, not in
# a test process. `default-filter` below is a RUN-time filter and the
# `ghc-heavy` test-group bounds test PROCESSES — neither touches rustc, so
# neither command is unconditionally GHC-free. What bounds the build-time
# cost is the macro's own content-addressed cache under each crate's
# `target/` (gitignored, keyed on source bytes + toolchain), paid once per
# worktree/`.hs` edit/toolchain bump.

[profile.default]
# Global test timeout: warn once a test has run past `period`, hard-kill it
# after `terminate-after` further periods. Sized for the heaviest
# differential/proptest suites under moderate machine contention.
slow-timeout = { period = "60s", terminate-after = 30 }

# Default tier: bare `cargo nextest run` skips the GHC-extract-heavy crates
# (every test in tidepool-runtime/repl/mcp/handlers forks a real GHC
# `extract` compile). tidepool-testing and tidepool-harness are MIXED crates
# — their lib unit tests are pure Rust (quick tier) but their tests/*.rs
# integration binaries reach GHC — so they're excluded by `kind(test)` rather
# than wholesale. tidepool-harness's `provider_behavior` and tidepool's
# non-`crash_recovery` binaries are the sole per-binary exceptions (pure-Rust,
# no extract/Harness use). Pass `--ignore-default-filter` (what
# `scripts/battery.sh` does) to run everything, or `--ignore-default-filter
# -p <crate>` for one heavy crate — `-p` alone is ANDed against this filter,
# not a bypass of it.
default-filter = 'not (package(tidepool-runtime) | package(tidepool-repl) | package(tidepool-mcp) | package(tidepool-handlers) | (package(tidepool-testing) & kind(test)) | (package(tidepool-harness) & kind(test) & !binary(provider_behavior)) | (package(tidepool) & binary(crash_recovery)))'

# GHC-heavy tests run below full core count so concurrent extractor requests do
# not oversubscribe CPU and memory. This is a per-run limit; callers running
# several batteries concurrently must budget their aggregate load.
[test-groups.ghc-heavy]
max-threads = 4

# Default-deny: everything is GHC-heavy unless it appears in the exemption
# filter below. An entry is removed from the cap only after showing
# its tests do no `extract` work (no tidepool-extract spawn, no
# EvalHarness/Harness turn, no haskell_eval!/haskell_inline! expansion).
[[profile.default.overrides]]
filter = 'not (package(tidepool-repr) | package(tidepool-eval) | package(tidepool-heap) | package(tidepool-bignum) | package(tidepool-optimize) | package(tidepool-effect) | package(tidepool-bridge) | package(tidepool-bridge-derive) | package(tidepool-bridge-effects) | package(tidepool-codegen) | package(tidepool-web) | (package(tidepool) & !binary(crash_recovery)) | (package(tidepool-testing) & !kind(test)) | (package(tidepool-harness) & (!kind(test) | binary(provider_behavior))))'
test-group = 'ghc-heavy'
