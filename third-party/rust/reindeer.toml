# The root Cargo workspace and Cargo.lock remain the dependency authority.
# Regenerate BUCK with the Reindeer release exposed as .#buck-reindeer.
manifest_path = "Cargo.toml"
third_party_dir = "."
vendor = false
precise_srcs = true
cargo_env = true

[buck]
file_name = "BUCK"
rust_library = "tidepool_cargo_rust_library"
rust_binary = "tidepool_cargo_rust_binary"
buildscript_genrule = "tidepool_buildscript_run"
buckfile_imports = """
load("//build/rust:buildscript.bzl", "tidepool_buildscript_run")
load("//build/rust:dependency_profiles.bzl", "tidepool_cargo_rust_library", "tidepool_cargo_rust_binary")
"""
generated_file_header = """
# @generated by Reindeer from the root Cargo.lock; edit reindeer.toml or fixups.
"""

[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"
execution-platform = true
